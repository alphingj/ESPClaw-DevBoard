name: Build ESP32-DevKitC Firmware
│ 
│ on:
│   push:
│     tags:
│       - 'v*'
│   workflow_dispatch:
│ 
│ jobs:
│   build:
│     runs-on: ubuntu-latest
│     steps:
│       - uses: actions/checkout@v4
│         with:
│           submodules: recursive
│       
│       - name: Setup ESP-IDF
│         uses: espressif/esp-idf-ci-action@v1
│         with:
│           esp_idf_version: v5.3
│           
│       - name: Copy board config
│         run: |
│           mkdir -p esp-claw/application/edge_agent/boards/community/esp32_devkitc
│           cp -r board/* esp-claw/application/edge_agent/boards/community/esp32_devkitc/
│           cp partitions_4MB.csv esp-claw/application/edge_agent/
│           
│       - name: Build firmware
│         working-directory: esp-claw/application/edge_agent
│         run: |
│           idf.py set-target esp32
│           idf.py bmgr --customer-path ./boards -b esp32_devkitc
│           idf.py build
│           
│       - name: Upload binary
│         uses: actions/upload-artifact@v4
│         with:
│           name: edge_agent-bin
│           path: esp-claw/application/edge_agent/build/edge_agent.bin
│           
│       - name: Release binary
│         if: startsWith(github.ref, 'refs/tags/')
│         uses: softprops/action-gh-release@v1
│         with:
│           files: esp-claw/application/edge_agent/build/edge_agent.bin
